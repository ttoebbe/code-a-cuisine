# Runs on every branch: the same three commands the deploy workflow runs before
# it uploads anything, so a broken build is caught before it reaches main.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # firebase.config.ts is gitignored, so a clean checkout does not have it and
      # the build cannot resolve the import. CI only has to prove that the code
      # compiles and nothing is deployed here, so the example values are enough.
      - name: Provide a Firebase config
        run: cp src/environments/firebase.config.example.ts src/environments/firebase.config.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Defaults to the production configuration, which swaps in
      # environment.prod.ts — so this also proves the deployed config compiles.
      - name: Build
        run: npm run build
