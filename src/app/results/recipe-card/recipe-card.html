<article class="recipe-card">
  <p class="recipe-card__caption">
    <img
      class="recipe-card__caption-icon"
      src="/img/results/icon-cloche.png"
      alt=""
      width="80"
      height="56"
    />
    {{ caption() }}
  </p>

  <h2 class="recipe-card__title">{{ recipe().title }}</h2>

  <p class="recipe-card__time">
    <span class="icon recipe-card__time-icon"></span>
    Cooking time: {{ cookingTime() }}
  </p>

  <a
    class="recipe-card__link"
    [routerLink]="['/results', index()]"
    [attr.aria-label]="'View recipe: ' + recipe().title"
  >
    View
  </a>
</article>
