name: Debug secrets

# Temporary diagnostic for the failing SFTP upload in deploy-frontend.yml.
# Prints only a fingerprint of each secret, never its value, so a typo or a
# stray newline can be spotted by comparing against a locally computed digest.
#
# The repository is public, so this log is public too: a SHA256 of the password
# would be open to offline brute force. The password therefore gets its byte
# count and a whitespace report instead of a digest — enough to catch the
# copy-paste faults, without publishing anything attackable.
#
# Delete this workflow once the deployment authenticates.

on:
  workflow_dispatch:

jobs:
  fingerprint:
    name: Fingerprint the SFTP secrets
    runs-on: ubuntu-latest

    steps:
      - name: Print byte length and SHA256 per secret
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          # Indirect expansion reads the value into a variable that is never
          # echoed — only its byte count and digest reach the log. printf '%s'
          # adds no trailing newline, so the count is the raw secret length.
          for name in SFTP_HOST SFTP_PORT SFTP_USER SFTP_REMOTE_DIR; do
            value="${!name-}"
            bytes="$(printf '%s' "$value" | wc -c)"
            digest="$(printf '%s' "$value" | sha256sum | cut -d ' ' -f 1)"
            printf '%-16s bytes=%-4s sha256=%s\n' "$name" "$bytes" "$digest"
          done

          # No digest for the password. Stripping everything from the first
          # non-space inward leaves exactly the padding, so its length is the
          # number of stray edge characters.
          value="${SFTP_PASSWORD-}"
          bytes="$(printf '%s' "$value" | wc -c)"
          lead="${value%%[![:space:]]*}"
          trail="${value##*[![:space:]]}"
          newlines="$(printf '%s' "$value" | tr -cd '\n' | wc -c)"
          printf '%-16s bytes=%-4s lead_ws=%s trail_ws=%s newlines=%s\n' \
            SFTP_PASSWORD "$bytes" "${#lead}" "${#trail}" "$newlines"
