<nav class="cookbook__nav" aria-label="Back">
  <a class="cookbook__back" routerLink="/">
    <span class="icon cookbook__back-icon"></span>
    <span class="cookbook__back-text">Back</span>
  </a>
</nav>

<div class="cookbook">
  <section class="cookbook__intro" aria-labelledby="cookbook-title">
    <div class="cookbook__lead">
      <h1 class="cookbook__title" id="cookbook-title">Cookbook</h1>
      <p class="cookbook__text">
        From quick bites to gourmet delights, explore them all in our ultimate cookbook and get
        inspired for your next culinary adventure.
      </p>
    </div>

    <app-most-liked-row
      [recipes]="favourites()"
      [isLoading]="isLoading()"
      [hasFailed]="hasFailed()"
      (retry)="reload()"
    />
  </section>

  <app-cuisine-filter />

  <p class="cookbook__footnote">
    <a class="cookbook__generate" routerLink="/generator">
      Generate new recipe <span aria-hidden="true">→</span>
    </a>
  </p>
</div>
