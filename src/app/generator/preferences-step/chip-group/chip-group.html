<fieldset class="chip-group">
  <legend class="chip-group__legend">
    <span class="icon chip-group__icon" [class]="iconClass()"></span>
    {{ legend() }}
  </legend>

  <div class="chip-group__options">
    @for (option of options(); track option.value) {
      <span class="chip-group__option">
        <input
          class="chip-group__input"
          type="radio"
          [id]="buildOptionId(option.value)"
          [name]="name()"
          [value]="option.value"
          [checked]="option.value === selected()"
          (change)="pick.emit(option.value)"
        />
        <label class="chip-group__chip" [for]="buildOptionId(option.value)">
          <span class="chip-group__label">{{ option.label }}</span>
          @if (option.hint) {
            <span class="chip-group__hint">{{ option.hint }}</span>
          }
        </label>
      </span>
    }
  </div>
</fieldset>
