<fieldset class="stepper-field">
  <legend class="stepper-field__legend">{{ label() }}</legend>

  <div class="stepper-field__control">
    <button
      type="button"
      class="stepper-field__button stepper-field__button--decrease"
      [attr.aria-label]="'Decrease ' + unit()"
      [disabled]="atMin()"
      (click)="step(-1)"
    >
      <span class="icon stepper-field__icon"></span>
    </button>

    <output class="stepper-field__value">{{ value() }}</output>
    <span class="stepper-field__unit">{{ unitLabel() }}</span>

    <button
      type="button"
      class="stepper-field__button stepper-field__button--increase"
      [attr.aria-label]="'Increase ' + unit()"
      [disabled]="atMax()"
      (click)="step(1)"
    >
      <span class="icon stepper-field__icon"></span>
    </button>
  </div>
</fieldset>
