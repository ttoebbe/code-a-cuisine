<form class="ingredient-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label class="ingredient-form__label ingredient-form__label--name" for="ingredient-name">
    Ingredient
  </label>

  <div class="ingredient-form__name">
    <input
      id="ingredient-name"
      class="ingredient-form__input ingredient-form__input--name"
      type="text"
      role="combobox"
      autocomplete="off"
      aria-autocomplete="list"
      formControlName="name"
      [attr.maxlength]="maxNameLength"
      [attr.aria-invalid]="isNameInvalid() ? 'true' : null"
      [attr.aria-describedby]="describesName() ? 'ingredient-notice' : null"
      [attr.aria-expanded]="isListboxOpen()"
      [attr.aria-controls]="suggestionListId"
      [attr.aria-activedescendant]="activeOptionId()"
      (input)="onNameInput()"
      (keydown)="onKeydown($event)"
      (blur)="closeSuggestions()"
    />

    @if (isListboxOpen()) {
      <div class="ingredient-form__suggestions">
        <app-ingredient-suggestions
          [suggestions]="suggestions()"
          [activeIndex]="activeIndex()"
          (pick)="pickSuggestion($event)"
        />
      </div>
    }
  </div>

  <label class="ingredient-form__label ingredient-form__label--size" for="ingredient-amount">
    Serving size
  </label>

  <div class="ingredient-form__size">
    <input
      id="ingredient-amount"
      class="ingredient-form__input ingredient-form__input--amount"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="100"
      formControlName="amount"
      [attr.aria-invalid]="isAmountInvalid() ? 'true' : null"
      [attr.aria-describedby]="describesAmount() ? 'ingredient-notice' : null"
    />

    <span class="ingredient-form__unit">
      <select class="ingredient-form__unit-select" formControlName="unit" aria-label="Unit">
        @for (option of unitOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </span>

    <button
      type="submit"
      class="ingredient-form__submit"
      [disabled]="isFull()"
      aria-label="Add ingredient"
    >
      <span class="icon ingredient-form__submit-icon"></span>
    </button>
  </div>

  <p
    id="ingredient-notice"
    class="ingredient-form__error"
    [class.ingredient-form__error--neutral]="isNoticeNeutral()"
    role="alert"
  >
    {{ noticeText() }}
  </p>
</form>
