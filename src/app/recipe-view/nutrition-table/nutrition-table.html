<section class="nutrition" aria-labelledby="nutrition-title">
  <h2 class="nutrition__title" id="nutrition-title">Nutritional information</h2>

  @for (row of rows(); track row.label) {
    <table class="nutrition__table">
      <caption class="nutrition__scope">
        {{
          row.label
        }}
      </caption>
      <thead>
        <tr>
          <th scope="col">Energy</th>
          <th scope="col">Protein</th>
          <th scope="col">Fat</th>
          <th scope="col">Carbs</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{ row.scope.kcal }} kcal</td>
          <td>{{ row.scope.protein.grams }}g</td>
          <td>{{ row.scope.fat.grams }}g</td>
          <td>{{ row.scope.carbs.grams }}g</td>
        </tr>
      </tbody>
    </table>
  }
</section>
