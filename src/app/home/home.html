<section class="hero" aria-labelledby="hero-title">
  <div class="hero__content">
    <div class="hero__intro">
      <p class="hero__eyebrow">AI-Powered recipe generator</p>
      <h1 id="hero-title" class="hero__title">Code à Cuisine</h1>
      <a routerLink="/generator" class="hero__cta">Get started</a>
    </div>
    <div class="hero__cross-sell">
      <p class="hero__cross-sell-title">Hungry for inspiration?</p>
      <a routerLink="/library" class="hero__cross-sell-link">
        Go to cookbook <span class="icon hero__cross-sell-arrow"></span>
      </a>
    </div>
  </div>
  <div class="hero__plates" aria-hidden="true">
    <!-- Up to 1439px the design stacks three plates (Figma aspect ratio 2.192),
         from 1440px its own set of five (3.161). Each set is painted as CSS
         backgrounds inside its media query, so neither viewport downloads the
         other one. The per-plate percentages are the Figma offsets, expressed
         against the stack rather than the viewport. The diameter floor stays
         low so short notebook viewports shrink the stack instead of slicing
         the last plate. From 1440px the stack is deliberately taller than its
         track, so the first and last plate bleed past the top and bottom edge
         the way the Figma widescreen frame shows them. -->
    <div class="hero__stack">
      <span class="hero__plate hero__plate--1"></span>
      <span class="hero__plate hero__plate--2"></span>
      <span class="hero__plate hero__plate--3"></span>

      <span class="hero__plate-wide hero__plate-wide--1"></span>
      <span class="hero__plate-wide hero__plate-wide--2"></span>
      <span class="hero__plate-wide hero__plate-wide--3"></span>
      <span class="hero__plate-wide hero__plate-wide--4"></span>
      <span class="hero__plate-wide hero__plate-wide--5"></span>
    </div>
  </div>
</section>
