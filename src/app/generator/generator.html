@if (generation.isLoading()) {
  <app-generation-loading />
}

@if (generation.error(); as error) {
  <app-generation-error-dialog
    [error]="error"
    (dismiss)="generation.dismissError()"
    (retry)="onRetry()"
    (editIngredients)="onEditIngredients()"
  />
}

<!-- Taken out of the page while a run is in flight: the curtain covers the wizard
     visually, so nothing behind it may still take keyboard focus or push the
     document taller than the viewport with scroll that leads nowhere. -->
<div
  class="generator__shell"
  [class.generator__shell--hidden]="generation.isLoading()"
  [attr.inert]="generation.isLoading() ? '' : null"
>
  @if (step() === 2) {
    <nav class="generator__nav" aria-label="Wizard steps">
      <button
        type="button"
        class="generator__back"
        aria-label="Back to ingredients"
        (click)="goToStep(1)"
      >
        <span class="icon generator__back-icon"></span>
        <span class="generator__back-text">Ingredients</span>
      </button>
    </nav>
  }

  <section class="generator" aria-labelledby="generator-title">
    <h1
      #stepHeading
      class="generator__title"
      id="generator-title"
      tabindex="-1"
      [class.generator__title--solo]="step() === 2"
    >
      {{ title() }}
    </h1>

    @switch (step()) {
      @case (1) {
        <p class="generator__lead">
          Got random stuff in your kitchen? Pop it in—we've got the perfect recipe waiting.
        </p>
        <app-ingredient-step (next)="goToStep(2)" />
      }
      @case (2) {
        <app-preferences-step />
      }
    }
  </section>
</div>
