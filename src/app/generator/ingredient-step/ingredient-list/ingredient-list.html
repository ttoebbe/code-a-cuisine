<section class="ingredient-list" aria-labelledby="ingredient-list-title">
  <h2 class="ingredient-list__title" id="ingredient-list-title">List of your Ingredients</h2>

  <ul class="ingredient-list__items">
    @for (ingredient of ingredients(); track $index) {
      <li class="ingredient-list__item">
        <app-ingredient-row
          [ingredient]="ingredient"
          [isEditing]="isEditing($index)"
          (edit)="onEdit($index)"
          (cancelEdit)="onCancel()"
          (save)="onSave($index, $event)"
          (remove)="onRemove($index)"
        />
      </li>
    }
  </ul>
</section>
