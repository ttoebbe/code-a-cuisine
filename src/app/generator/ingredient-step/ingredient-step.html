<div class="ingredient-step__columns">
  <app-ingredient-form [isFull]="state.isFull()" (save)="onAdd($event)" />
  <app-ingredient-list
    [ingredients]="state.ingredients()"
    (update)="onUpdate($event)"
    (remove)="onRemove($event)"
  />
</div>

<div class="ingredient-step__actions">
  <button
    type="button"
    class="ingredient-step__next"
    [class.ingredient-step__next--hidden]="!state.hasIngredients()"
    [disabled]="!state.hasIngredients()"
    (click)="next.emit()"
  >
    Next step
  </button>
</div>
